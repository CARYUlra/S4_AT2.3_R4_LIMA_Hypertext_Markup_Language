<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Testes</title>
</head> 
<body>
    <form>
    <h1>Fieldset 1</h1>
    <hr>
    <!--Grupo 01 dados do cliente em fieldset-->
    <fieldset>
        <legend><strong>1. Dados dos Clientes</strong></legend>
        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </p>
        <p>
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seu.email@exemplo.com" required>
        </p>
        <p>
            <label for="whatsapp">WhatsApp:</label>
            <input type="tel" id="whatsapp" name="whatsapp" placeholder="(11) 99999-9999" required>
        </p>
        <p>
            <label for="descrição">Descrição:</label>
            <textarea id="descrição" name="descrição" placeholder="Digite uma descrição"></textarea>
        </p>
    </fieldset>
    <hr>
    <!-- grupo 2 configuração de hardware -->
    <fieldset>
        <legend><strong>2. Configuração de Hardware</strong></legend>
        <p>
            <label for="gpu">Escolha a Placa de Vídeo Principal:</label>
            <select id="gpu" name="gpu" required>
                <option value="">-- Selecione uma GPU --</option>
                <option value="gtx1650">NVIDIA GTX 1650 4GB (Entry)</option>
                <option value="rtx4060ti">NVIDIA RTX 4060 Ti 8GB (Mid-Range)</option>
                <option value="rtx4090">NVIDIA RTX 4090 24GB (High-End 4K)</option>
            </select>
        </p>
    </fieldset>
    <p>
        <strong> serviços e adiionar desejos</strong>
        <div>
        <input type="radio" id="jogos" name="objetivo" value="jogos" checked></input>
        <label for="jogos">Jogos Eletrônicos / eSports</label><br>
        <input type="radio" id="streaming" name="objetivo" value="streaming"></input>
        <label for="streaming">Live Stream / Criação de Conteúdo</label><br>
        <input type="radio" id="trabalho" name="objetivo" value="trabalho"></input>
        <label for="trabalho">Edição de Vídeo 3D / Arquitetura</label><br>  
        </div>
    </p>
     <p>
        <strong> serviços e adiionar opicionais</strong>
        <div>
        <input type="checkbox" id="led" name="adicionais" value="rgb" checked></input>
        <label for="led">Luzes RGB</label><br>
        <input type="checkbox" id="overclock" name="adicionais" value="overclock"></input>
        <label for="overclock">Overclock</label><br>
        <input type="checkbox" id="garantia extendida" name="adicionais" value="garantia extendida"></input>
        <label for="garantia extendida">Garantia Estendida</label><br>  
        </div>
    </p>
    <p>
        <label for="observacoes"><strong>Observações ou dúvidas:</strong></label><br>
        <textarea id="observacoes" name="observacoes" rows="4" cols="50" placeholder="Digite suas observações ou dúvidas"></textarea>
    </p>
    <p>
         <label for="foto_referencia">anexar foto de referência</label><br>
         <input type="file" id="foto_referencia" name="foto_referencia" accept="image/*">
    </p>
    <p>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </p>
</body>
</html>
